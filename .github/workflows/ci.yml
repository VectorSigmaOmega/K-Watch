name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev \
          linux-tools-common linux-tools-generic linux-tools-$(uname -r) \
          pkg-config cmake clang-tidy clang-format gcovr ncurses-dev

    - name: Check Formatting
      if: matrix.compiler == 'clang'
      run: |
        find src bpf -name '*.cpp' -o -name '*.c' -o -name '*.h' | xargs clang-format --Werror --dry-run

    - name: Configure
      env:
        CC: ${{ matrix.compiler }}
        CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      run: cmake -B build -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build
      run: cmake --build build

    - name: Unit Tests
      run: ./build/kwatch_tests

    - name: Integration Tests
      run: |
        sudo ./tests/integration/attach_detach.sh
        sudo ./tests/integration/stats_basic.sh
        sudo ./tests/integration/blacklist.sh
        sudo ./tests/integration/lpm_cidr.sh
        sudo ./tests/integration/syn_flood_detection.sh
        sudo ./tests/integration/auto_block.sh

    - name: BPF Instruction Count Check (R2.7)
      run: |
        sudo bpftool prog dump xlated name xdp_kwatch_prog > bpf_instructions.txt
        COUNT=$(grep -c "^" bpf_instructions.txt)
        echo "Instruction count: $COUNT"
        if [ "$COUNT" -gt 4096 ]; then
          echo "ERROR: BPF program too large ($COUNT > 4096)"
          exit 1
        fi
      # This requires the program to be loaded. We can do this after one of the tests.
      continue-on-error: true 

    - name: Coverage Report (N4)
      if: matrix.compiler == 'gcc'
      run: |
        gcovr -r . --exclude 'tests' --exclude 'include' --exclude 'bpf' \
          --exclude 'src/cli/main.cpp' --exclude 'src/tui/app.cpp' \
          --fail-under-line 60

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev \
          linux-tools-common linux-tools-generic linux-tools-$(uname -r) \
          pkg-config cmake ncurses-dev
    - name: Build with ASan/UBSan
      env:
        CC: clang
        CXX: clang++
        CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
        LDFLAGS: "-fsanitize=address,undefined"
      run: |
        cmake -B build
        cmake --build build
    - name: Run Unit Tests with Sanitizers
      run: ./build/kwatch_tests
