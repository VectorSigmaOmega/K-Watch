name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' # Nightly fuzz (R9/M6)

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev \
          linux-tools-common linux-tools-generic linux-tools-$(uname -r) \
          pkg-config cmake clang-tidy clang-format gcovr ncurses-dev jq

    - name: Check Formatting (N6)
      if: matrix.compiler == 'clang'
      run: |
        find src bpf -name '*.cpp' -o -name '*.c' -o -name '*.h' | xargs clang-format --Werror --dry-run

    - name: Configure
      env:
        CC: ${{ matrix.compiler }}
        CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      run: cmake -B build -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build
      run: cmake --build build

    - name: Unit Tests
      run: ./build/kwatch_tests

    - name: Integration Tests
      run: |
        sudo ./tests/integration/crash_safety.sh
        sudo ./tests/integration/stats_basic.sh
        sudo ./tests/integration/blacklist.sh
        sudo ./tests/integration/lpm_cidr.sh
        sudo ./tests/integration/syn_flood_detection.sh
        sudo ./tests/integration/auto_block.sh
        sudo ./tests/integration/permission_errors.sh

    - name: BPF Instruction Count Check (R2.7)
      run: |
        sudo ./build/kwatch run lo > /dev/null 2>&1 &
        KPID=$!
        sleep 3
        # bytes_xlated is reported as the size of the xlated BPF instruction
        # stream in bytes; divide by 8 (every BPF instruction is 8 bytes) to
        # get instruction count. PRD R2.7 caps at 4096.
        BYTES=$(sudo bpftool prog show name xdp_kwatch_prog -j | jq '.[0].bytes_xlated')
        sudo kill $KPID || true
        wait $KPID 2>/dev/null || true
        if [ -z "$BYTES" ] || [ "$BYTES" = "null" ]; then
          echo "ERROR: could not read bytes_xlated for xdp_kwatch_prog"
          exit 1
        fi
        COUNT=$((BYTES / 8))
        echo "BPF instruction count: $COUNT (bytes_xlated=$BYTES)"
        if [ "$COUNT" -gt 4096 ]; then
          echo "ERROR: BPF program too large ($COUNT > 4096)"
          exit 1
        fi
        if [ "$COUNT" -lt 10 ]; then
          echo "ERROR: BPF program looks empty"
          exit 1
        fi

    - name: Fuzz Smoke Test (60s)
      if: matrix.compiler == 'clang'
      run: timeout 60s ./build/kwatch_fuzz_parser || [ $? -eq 124 ]

    - name: Coverage Report (N4)
      if: matrix.compiler == 'gcc'
      run: |
        gcovr -r . --exclude 'tests' --exclude 'include' --exclude 'bpf' \
          --exclude 'src/cli/main.cpp' --exclude 'src/tui/app.cpp' \
          --fail-under-line 60

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev \
          linux-tools-common linux-tools-generic linux-tools-$(uname -r) \
          pkg-config cmake ncurses-dev
    - name: Build with ASan/UBSan
      env:
        CC: clang
        CXX: clang++
        CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
        LDFLAGS: "-fsanitize=address,undefined"
      run: |
        cmake -B build
        cmake --build build
    - name: Run Tests with Sanitizers
      run: |
        ./build/kwatch_tests
        sudo ./tests/integration/crash_safety.sh
        sudo ./tests/integration/stats_basic.sh
        sudo ./tests/integration/blacklist.sh
