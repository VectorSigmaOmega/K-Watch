name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev \
            linux-tools-common linux-tools-generic \
            pkg-config cmake clang-format ncurses-dev jq

      - name: Check Formatting (N6)
        if: matrix.compiler == 'clang'
        run: |
          find src bpf tests \( -path 'tests/vendored' -o -path 'tests/vendored/*' \) -prune -o \
            \( -name '*.cpp' -o -name '*.c' -o -name '*.h' \) -print | \
            xargs clang-format --Werror --dry-run

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Unit Tests
        run: ./build/kwatch_tests
